<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>doom-js</title>
<style>
  :root { --bg: #0b0b0d; --txt: #b8b8c0; --accent: #ff5a3c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--txt);
         font-family: ui-monospace, Consolas, monospace; padding: 16px; }
  h1 { font-size: 18px; color: var(--accent); font-weight: 400; margin-bottom: 12px; }
  #drop { border: 2px dashed #444; padding: 32px 16px; text-align: center; margin-bottom: 16px; }
  #drop.over { border-color: var(--accent); }
  #status { margin-bottom: 12px; font-size: 14px; white-space: pre-wrap; }
  #bar { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; font-size: 13px; flex-wrap: wrap; }
  #bar label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  select, button { background: #1a1a1f; color: var(--txt); border: 1px solid #444; padding: 4px 8px; font: inherit; cursor: pointer; }
  body { display: flex; flex-direction: column; align-items: center; }
  #stage { width: min(100%, calc((100dvh - 150px) * 4 / 3)); position: relative; }
  #stage:fullscreen { width: 100vw; height: 100dvh; background: #000; display: grid; place-items: center; }
  #stage:fullscreen #view { width: min(100vw, calc(100dvh * 4 / 3)); }
  /* 모바일: 게임 화면만 전체 사용, 4:3 비율 유지(잘림 없음) */
  html.is-touch body { padding: 0; }
  html.is-touch h1, html.is-touch #drop, html.is-touch #status, html.is-touch #help, html.is-touch #bar { display: none; }
  .is-touch #stage { position: fixed; inset: 0; width: 100vw; height: 100dvh; background: #000;
                     display: grid; place-items: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .is-touch #view { width: min(100vw, calc(100dvh * 4 / 3)); border: 0; }
  #msg { position: absolute; top: 8px; left: 12px; color: #ffd23c; font-size: 14px; text-shadow: 1px 1px 0 #000; pointer-events: none; }
  #hurt { position: absolute; inset: 0; background: #c00; opacity: 0; pointer-events: none; }
  #overlay { position: absolute; inset: 0 0 auto 0; margin: 15% auto 0; width: min(80%, 420px); padding: 20px;
             background: rgba(0,0,0,.78); border: 1px solid #555; text-align: center; line-height: 1.6; pointer-events: none; }
  #overlay b { color: var(--accent); font-size: 22px; font-weight: 400; }
  #view { display: block; width: 100%; aspect-ratio: 4 / 3; background: #000; border: 1px solid #333;
          image-rendering: pixelated; cursor: crosshair; }
  #automap { display: block; width: 100%; height: 70vh; background: #000; border: 1px solid #333; cursor: grab; }
  #automap.drag { cursor: grabbing; }
  #hud { margin-top: 6px; font-size: 12px; min-height: 1.4em; }
  .help { margin-top: 8px; font-size: 12px; }
  .help b { color: var(--accent); font-weight: 400; }
  /* 터치 조작 */
  #touch { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; display: none; }
  .is-touch #touch { display: block; }
  #touch .t-turn { position: absolute; top: 0; right: 0; bottom: 0; width: 55%; }
  #touch .t-stick { position: absolute; left: 4%; bottom: 14%; width: 120px; height: 120px; border-radius: 50%;
                    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); display: grid; place-items: center; }
  #touch .t-thumb { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.45); }
  #touch .t-btn { position: absolute; width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5);
                  background: rgba(255,90,60,.45); color: #fff; font: 700 13px ui-monospace, Consolas, monospace; }
  #touch .t-fire { right: 4%; bottom: 16%; width: 92px; height: 92px; }
  #touch .t-use { right: 28%; bottom: 10%; background: rgba(80,160,255,.45); }
  #touch .t-weapon { right: 4%; bottom: 46%; background: rgba(255,210,60,.4); }
  #touch .t-small { position: absolute; top: 6px; padding: 4px 10px; font-size: 11px; opacity: .8; }
  #touch .t-menu { right: 6px; } #touch .t-map { right: 64px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>doom-js · Phase 7 — 소리 · 메뉴 · 모바일</h1>
  <div id="drop">
    <p>public/wad/DOOM1.WAD 를 찾지 못하면 여기에 WAD 파일을 드롭하거나 선택하세요</p>
    <input type="file" id="file" accept=".wad,.WAD">
  </div>
  <div id="status">로딩 중…</div>
  <div id="bar" hidden>
    <label>맵 <select id="mapSel"></select></label>
    <button id="btnMode">오토맵 (Tab)</button>
    <button id="btnFull">전체화면</button>
    <label><input type="checkbox" id="optSfx" checked> 효과음</label>
    <label><input type="checkbox" id="optMusic" checked> 음악</label>
    <span id="mapOpts" hidden>
      <label><input type="checkbox" id="optFollow" checked> 따라가기 (F)</label>
      <label><input type="checkbox" id="optFlat"> 높이 같은 양면선</label>
      <label><input type="checkbox" id="optThings"> Things (T)</label>
      <button id="btnFit">전체 보기 (0)</button>
    </span>
  </div>
  <div id="stage" hidden>
    <canvas id="view"></canvas>
    <canvas id="automap" hidden></canvas>
    <div id="hurt"></div>
    <div id="msg"></div>
    <div id="overlay" hidden></div>
    <div id="hud"></div>
  </div>
  <p class="help" id="help" hidden>
    <b>WASD</b> 이동 · <b>Shift</b> 달리기 · <b>←/→</b> 회전 · <b>E/Space</b> 사용(문·스위치) · <b>Ctrl/F/마우스 왼쪽</b> 발사 · <b>1~5</b> 무기(휠 순환) · <b>클릭</b> 마우스 시점 · <b>Esc</b> 메뉴(일시정지) · <b>Tab</b> 오토맵 · <b>R</b> 재시작 ·
    디버그: <b>N</b> noclip · <b>K</b> 열쇠 전부 ·
    오토맵: <b>휠</b> 줌 · <b>드래그</b> 팬 · <b>F</b> 따라가기 · <b>T</b> Things · <b>0</b> 전체 보기
  </p>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
